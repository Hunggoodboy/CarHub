<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Người dùng - Admin Dashboard</title>
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>

<div class="dashboard-container">
    <!-- SIDEBAR -->
    <aside class="dash-sidebar">
        <div class="dash-sidebar-logo">
            CarShop
        </div>
        
        <div class="dash-nav">
            <a th:href="@{/admin/manage}" class="dash-nav-item tab-btn active" style="text-decoration: none;">
                <i class="fa-solid fa-users"></i> Người dùng
            </a>
            <a th:href="@{/admin/manage}" class="dash-nav-item tab-btn" style="text-decoration: none;">
                <i class="fa-solid fa-car"></i> Sản phẩm
            </a>
            <a th:href="@{/admin/manage}" class="dash-nav-item tab-btn" style="text-decoration: none;">
                <i class="fa-solid fa-file-invoice-dollar"></i> Đơn hàng
            </a>
        </div>
        
        <div class="dash-sidebar-footer">
            <a href="/"><i class="fa-solid fa-arrow-left"></i> Về cửa hàng</a>
            <a href="/logout" style="margin-top: 16px;"><i class="fa-solid fa-sign-out-alt"></i> Đăng xuất</a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dash-content">
        <header class="dash-topbar">
            <h1 class="dash-page-title">Sửa thông tin Người dùng</h1>
            
            <div class="dash-topbar-actions">
                <div class="dash-user-profile">
                    <span th:text="${#authentication.name}">Admin</span>
                    <div class="dash-user-avatar">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                </div>
            </div>
        </header>

        <div class="dash-workspace">
            <div th:if="${successMessage}" class="dash-card" style="background-color: #dcfce7; border-color: #86efac; color: #166534; padding: 16px 24px; font-weight: 500; display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-check-circle" style="font-size: 20px;"></i>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="dash-card" style="background-color: #fee2e2; border-color: #fca5a5; color: #991b1b; padding: 16px 24px; font-weight: 500; display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-exclamation-circle" style="font-size: 20px;"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <div class="dash-card">
                <div class="dash-card-header">
                    <div>
                        <h2 class="dash-card-title">Tài khoản #<span th:text="${user.id}"></span></h2>
                        <p style="font-size: 13px; color: var(--dash-text-muted); margin: 4px 0 0 0;">Thiết lập lại các thông tin cá nhân của người dùng này</p>
                    </div>
                    <a th:href="@{/admin/manage}" class="dash-btn dash-btn-outline"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
                </div>

                <div class="dash-card-body">
                    <form th:action="@{|/admin/users/${user.id}/update|}" th:object="${user}" method="post">
                        <div class="dash-form-grid">
                            
                            <div class="dash-form-group">
                                <label class="dash-form-label">Username</label>
                                <div class="dash-input" style="background-color: #f3f4f6; color: #6b7280; font-weight: 500; cursor: not-allowed;" th:text="*{username} ?: '-'"></div>
                            </div>
                            
                            <div class="dash-form-group">
                                <label class="dash-form-label">Vai trò hệ thống</label>
                                <div class="dash-input" style="background-color: #f3f4f6; font-weight: 600; cursor: not-allowed;" th:text="*{role}"></div>
                            </div>
                            
                            <div class="dash-form-group">
                                <label class="dash-form-label" for="fullName">Họ và tên</label>
                                <input id="fullName" type="text" th:field="*{fullName}" class="dash-input" required>
                            </div>
                            
                            <div class="dash-form-group">
                                <label class="dash-form-label" for="email">Địa chỉ Email</label>
                                <input id="email" type="email" th:field="*{email}" class="dash-input" required>
                            </div>
                            
                            <div class="dash-form-group">
                                <label class="dash-form-label" for="phoneNumber">Số điện thoại</label>
                                <input id="phoneNumber" type="text" th:field="*{phoneNumber}" class="dash-input">
                            </div>
                            
                            <div class="dash-form-group">
                                <label class="dash-form-label" for="address">Địa chỉ thường trú</label>
                                <input id="address" type="text" th:field="*{address}" class="dash-input">
                            </div>
                        </div>

                        <div style="margin-top: 32px; display: flex; gap: 16px; border-top: 1px solid var(--dash-border); padding-top: 24px;">
                            <button type="submit" class="dash-btn dash-btn-primary"><i class="fa-solid fa-save"></i> Lưu cập nhật</button>
                            <a th:href="@{/admin/manage}" class="dash-btn dash-btn-outline">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
