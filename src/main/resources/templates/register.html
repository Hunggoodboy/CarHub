<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập CarHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/auth.css" th:href="@{/css/auth.css}">
</head>

<body>
    <div class="login-page">
        <div class="auth-card">

            <div class="auth-card__left">
                <a href="/login" class="auth-card__tab ">ĐĂNG NHẬP</a>
                <a href="/register" class="auth-card__tab active">ĐĂNG KÍ</a>
            </div>

            <div class="auth-card__right">

                <div class="auth-card__header">
                    <i class="fa-solid fa-layer-group auth-card__logo-icon"></i>
                    <h3 class="auth-card__title">
                        <DIV></DIV>
                    </h3>
                </div>

                <div id="register-error" class="alert alert-danger"
                    style="display:none; color: red; text-align: center; margin-bottom: 10px;">
                    <span id="error-message">Đăng ký chưa thành công, vui lòng kiểm tra lại thông tin.</span>
                </div>

                <form action="/register" method="post" class="auth-card__form">
                    <div class="auth-card__group">
                        <i class="fa-solid fa-user auth-card__icon"></i>
                        <input type="text" name="username" class="auth-card__input" placeholder="Username" required
                            minlength="3" maxlength="50">
                    </div>
                    <div class="auth-card__group">
                        <i class="fa-solid fa-lock auth-card__icon"></i>
                        <input type="password" name="password" class="auth-card__input" placeholder="Password" required
                            minlength="6">
                    </div>
                    <div class="auth-card__group">
                        <i class="fa-solid fa-lock auth-card__icon"></i>
                        <input type="password" name="confirmPassword" class="auth-card__input"
                            placeholder="Confirm Password" required minlength="6">
                    </div>

                    <div class="auth-card__group">
                        <i class="fa-solid fa-envelope auth-card__icon"></i>
                        <input type="email" name="email" class="auth-card__input" placeholder="Email" required>
                    </div>

                    <div class="auth-card__group">
                        <i class="fa-solid fa-signature auth-card__icon"></i>
                        <input type="text" name="fullName" class="auth-card__input" placeholder="Full Name" required
                            minlength="2" maxlength="100">
                    </div>
                    <div class="auth-card__group">
                        <i class="fa-solid fa-phone auth-card__icon"></i>
                        <input type="tel" name="phoneNumber" class="auth-card__input" placeholder="Phone Number"
                            required pattern="[0-9]{10,11}">
                    </div>
                    <div class="auth-card__actions">
                        <a href="/login" class="auth-card__forgot">Đã có tài khoản?</a>
                        <button type="submit" class="btn btn--gradient">ĐĂNG KÍ</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <script th:src="@{/js/register.js}"></script>
</body>

</html>
