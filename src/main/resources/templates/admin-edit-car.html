<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Xe - Admin Dashboard</title>
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>

<div class="dashboard-container">
    <!-- SIDEBAR -->
    <aside class="dash-sidebar">
        <div class="dash-sidebar-logo">
            CarShop
        </div>
        
        <div class="dash-nav">
            <a th:href="@{/admin/manage}" class="dash-nav-item tab-btn" style="text-decoration: none;">
                <i class="fa-solid fa-users"></i> Người dùng
            </a>
            <a th:href="@{/admin/manage}" class="dash-nav-item tab-btn active" style="text-decoration: none;">
                <i class="fa-solid fa-car"></i> Sản phẩm
            </a>
            <a th:href="@{/admin/manage}" class="dash-nav-item tab-btn" style="text-decoration: none;">
                <i class="fa-solid fa-file-invoice-dollar"></i> Đơn hàng
            </a>
        </div>
        
        <div class="dash-sidebar-footer">
            <a href="/"><i class="fa-solid fa-arrow-left"></i> Về cửa hàng</a>
            <a href="/logout" style="margin-top: 16px;"><i class="fa-solid fa-sign-out-alt"></i> Đăng xuất</a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dash-content">
        <header class="dash-topbar">
            <h1 class="dash-page-title">Sửa thông tin Xe</h1>
            
            <div class="dash-topbar-actions">
                <div class="dash-user-profile">
                    <span th:text="${#authentication.name}">Admin</span>
                    <div class="dash-user-avatar">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                </div>
            </div>
        </header>

        <div class="dash-workspace">
            <div th:if="${successMessage}" class="dash-card" style="background-color: #dcfce7; border-color: #86efac; color: #166534; padding: 16px 24px; font-weight: 500; display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-check-circle" style="font-size: 20px;"></i>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="dash-card" style="background-color: #fee2e2; border-color: #fca5a5; color: #991b1b; padding: 16px 24px; font-weight: 500; display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-exclamation-circle" style="font-size: 20px;"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <div class="dash-card">
                <div class="dash-card-header">
                    <div>
                        <h2 class="dash-card-title">Xe #<span th:text="${car.id}"></span></h2>
                        <p style="font-size: 13px; color: var(--dash-text-muted); margin: 4px 0 0 0;">Cập nhật thông số chi tiết của chiếc xe này</p>
                    </div>
                    <a th:href="@{/admin/manage#products}" class="dash-btn dash-btn-outline"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
                </div>

                <div class="dash-card-body">
                    <div style="display: flex; gap: 32px; align-items: flex-start; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--dash-border);">
                        <img th:if="${car.imageUrl != null}" 
                             th:src="@{|/${car.imageUrl}|}" 
                             alt="Car image" 
                             style="width: 250px; height: 160px; object-fit: cover; border-radius: 8px; border: 1px solid var(--dash-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                        
                        <div style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 14px;">
                            <div>
                                <span style="display: block; color: var(--dash-text-muted); margin-bottom: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase;">Người bán (Seller)</span>
                                <span style="font-weight: 500;" th:text="${car.sellerName ?: 'Chưa rõ'}"></span>
                            </div>
                            <div>
                                <span style="display: block; color: var(--dash-text-muted); margin-bottom: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase;">Ảnh hiện tại</span>
                                <span style="font-family: monospace;" th:text="${car.imageUrl ?: 'Chưa có ảnh'}"></span>
                            </div>
                        </div>
                    </div>

                    <form th:action="@{|/admin/cars/${car.id}/update|}" th:object="${car}" method="post">
                        <div class="dash-form-grid">
                            <div class="dash-form-group">
                                <label class="dash-form-label" for="model">Tên mẫu xe (Model)</label>
                                <input id="model" type="text" th:field="*{model}" class="dash-input" required>
                            </div>

                            <div class="dash-form-group">
                                <label class="dash-form-label" for="brandId">Hãng sản xuất</label>
                                <select id="brandId" th:field="*{brandId}" class="dash-input" required>
                                    <option value="">Chọn hãng xe</option>
                                    <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"></option>
                                </select>
                            </div>

                            <div class="dash-form-group">
                                <label class="dash-form-label" for="price">Giá bán (VNĐ)</label>
                                <input id="price" type="number" min="0" step="1000" th:field="*{price}" class="dash-input" required>
                            </div>

                            <div class="dash-form-group">
                                <label class="dash-form-label" for="discount">Phần trăm giảm giá (%)</label>
                                <input id="discount" type="number" min="0" max="100" step="0.01" th:field="*{discount}" class="dash-input" required>
                            </div>

                            <div class="dash-form-group">
                                <label class="dash-form-label" for="manufactureYear">Năm sản xuất</label>
                                <input id="manufactureYear" type="number" min="1900" step="1" th:field="*{manufactureYear}" class="dash-input" required>
                            </div>

                            <div class="dash-form-group">
                                <label class="dash-form-label" for="stockQuantity">Tồn kho</label>
                                <input id="stockQuantity" type="number" min="0" step="1" th:field="*{stockQuantity}" class="dash-input" required>
                            </div>

                            <div class="dash-form-group" style="grid-column: 1 / -1;">
                                <label class="dash-form-label" for="color">Màu sắc</label>
                                <input id="color" type="text" th:field="*{color}" class="dash-input" required>
                            </div>

                            <div class="dash-form-group" style="grid-column: 1 / -1;">
                                <label class="dash-form-label" for="description">Mô tả hiển thị</label>
                                <textarea id="description" th:field="*{description}" class="dash-input" rows="4"></textarea>
                            </div>
                        </div>

                        <div style="margin-top: 32px; display: flex; gap: 16px; border-top: 1px solid var(--dash-border); padding-top: 24px;">
                            <button type="submit" class="dash-btn dash-btn-primary"><i class="fa-solid fa-save"></i> Lưu thông số xe</button>
                            <a th:href="@{/admin/manage#products}" class="dash-btn dash-btn-outline">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
