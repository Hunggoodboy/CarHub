<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu CarHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/auth.css">
</head>

<body>
    <div class="login-page">
        <div class="auth-card" style="flex-direction: column; width: 100%; max-width: 450px; height: auto;">

            <div class="auth-card__right" style="width: 100%; padding: 60px 40px;">

                <div class="auth-card__header">
                    <i class="fa-solid fa-key auth-card__logo-icon"></i>
                    <h3 class="auth-card__title">QUÊN MẬT KHẨU</h3>
                </div>

                <p style="text-align: center; color: #777; margin-top: -20px; margin-bottom: 25px; font-size: 14px;">
                    Nhập email của bạn, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.
                </p>

                <div id="forgot-sent" class="alert alert-success"
                    style="display:none; color: green; text-align: center; margin-bottom: 10px;">
                    Yêu cầu đã được ghi nhận. Vui lòng kiểm tra email của bạn.
                </div>

                <form action="/forgot-password" method="post" class="auth-card__form">
                    <div class="auth-card__group">
                        <i class="fa-solid fa-envelope auth-card__icon"></i>
                        <input type="email" name="email" class="auth-card__input" placeholder="Email" required>
                    </div>

                    <div class="auth-card__actions" style="justify-content: flex-end;">
                        <button type="submit" class="btn btn--gradient">GỬI LIÊN KẾT</button>
                    </div>
                </form>

                <div class="auth-card__social-footer">
                    <span class="auth-card__social-text">Đã nhớ mật khẩu?</span>
                    <div class="auth-card__social-icons">
                        <a href="/login" class="social-link">
                            <i class="fa-solid fa-arrow-left" style="color: #ff5e62;"></i> Trở về đăng nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.has('sent')) document.getElementById('forgot-sent').style.display = 'block';
    </script>
</body>

</html>
