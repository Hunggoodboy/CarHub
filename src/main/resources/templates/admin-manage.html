<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - CarHub</title>
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
</head>
<body>

<div class="dashboard-container">
    <!-- SIDEBAR -->
    <aside class="dash-sidebar">
        <a href="/" class="dash-sidebar-logo">
            CarShop
        </a>
        
        <div class="dash-nav">
            <div class="dash-nav-item tab-btn active" data-target="users">
                <i class="fa-solid fa-users"></i> Người dùng
            </div>
            <div class="dash-nav-item tab-btn" data-target="products">
                <i class="fa-solid fa-car"></i> Sản phẩm
            </div>
            <div class="dash-nav-item tab-btn" data-target="orders">
                <i class="fa-solid fa-file-invoice-dollar"></i> Đơn hàng
            </div>
        </div>
        
        <div class="dash-sidebar-footer">
            <a href="/"><i class="fa-solid fa-arrow-left"></i> Về cửa hàng</a>
            <a href="/logout" style="margin-top: 16px;"><i class="fa-solid fa-sign-out-alt"></i> Đăng xuất</a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dash-content">
        <header class="dash-topbar">
            <h1 class="dash-page-title" id="page-title">Quản lý người dùng</h1>
            
            <div class="dash-topbar-actions">
                <div class="dash-user-profile">
                    <span th:text="${#authentication.name}">Admin</span>
                    <div class="dash-user-avatar">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                </div>
            </div>
        </header>
        
        <div class="dash-workspace">
            <div class="dash-card">
                <div class="dash-card-header">
                    <h2 class="dash-card-title" id="page-desc">Danh sách tài khoản hệ thống</h2>
                </div>
                
                <div class="dash-card-body">
                    <!-- Khu vực lọc tìm kiếm (Chỉ hiện cho Người dùng và Xe) -->
                    <div class="dash-search-wrap" id="search-section">
                        <input type="text" id="searchInput" class="dash-input" placeholder="Tìm kiếm...">
                        <button class="dash-btn dash-btn-primary" id="btn-search"><i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm</button>
                    </div>
                    
                    <div class="dash-table-wrap" id="table-container">
                        <!-- Ajax data here -->
                        <div class="dash-empty">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                            <p>Đang tải dữ liệu...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/admin-manage.js}"></script>
</body>
</html>
