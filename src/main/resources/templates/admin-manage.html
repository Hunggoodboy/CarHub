<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/admin-manage.css}">
</head>

<body>

    <div id="sidebar" class="sidebar">
        <h2>Quản lý</h2>
        <ul>
            <li class="menu-item active" data-section="users">Quản lý người dùng</li>
            <li class="menu-item" data-section="products">Quản lý sản phẩm</li>
            <li class="menu-item" data-section="orders">Quản lý đơn hàng</li>
        </ul>
    </div>

    <div id="main" class="main">

    
        <div class="navbar">
            <span id="toggleBtn" class="toggle-btn">☰</span>
            <span>Trang quản lý</span>
        </div>
        <div class="header">
            <h1>Quản lý hệ thống</h1>
        </div>

        <div class="content">
            <div id="users" class="section active-section">
                <h2>Quản lý người dùng</h2>
            </div>

            <div id="products" class="section">
                <h2>Quản lý sản phẩm</h2>
            </div>

            <div id="orders" class="section">
                <h2>Quản lý đơn hàng</h2>

                <div class="order-tabs">
                    <button class="tab-btn active" onclick="switchTab(event, 'ALL')">Tất cả</button>
                    <button class="tab-btn" onclick="switchTab(event, 'PENDING')">Chưa thanh toán</button>
                    <button class="tab-btn" onclick="switchTab(event, 'SUCCESS')">Đã thanh toán</button>
                </div>

                <div id="admin-order-list"></div>
            </div>

        </div>
    </div>

    <script th:src="@{/js/admin-manage.js}"></script>
</body>
</html>
